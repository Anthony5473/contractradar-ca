name: ContractRadar CA Daily Open-Data Refresh

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ContractRadar ingestion & static site build
        run: python run_daily.py --db data/contractradar.sqlite --out docs
      - name: Commit updated static explorer feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: daily CanadaBuys refresh"
          git push
